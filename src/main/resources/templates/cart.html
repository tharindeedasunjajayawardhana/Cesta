
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cart | Cesta Basket</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="site-header">
    <div class="navbar">
        <a th:href="@{/}" class="logo">
            <span class="logo-icon">🧺</span>
            <span>Cesta<span class="logo-dot">.</span></span>
        </a>
        <nav class="main-nav">
            <a th:href="@{/}">Home</a>
            <a th:href="@{/account}">My Account</a>
        </nav>
    </div>
</header>

<main class="cart-page">
    <h1>My Shopping Cart</h1>

    <p class="cart-message"
       th:if="${cartMessage}"
       th:text="${cartMessage}"></p>

    <div th:if="${#lists.isEmpty(cartItems)}" class="empty-cart">
        <h2>Your cart is empty</h2>
        <p>Discover fresh products and add your favourites.</p>
        <a th:href="@{/}" class="cart-button">Continue Shopping</a>
    </div>

    <div th:unless="${#lists.isEmpty(cartItems)}">
        <article class="cart-item" th:each="item : ${cartItems}">
            <div class="cart-item-info">
                <h3 th:text="${item.product.name}">Product name</h3>

                <p>
                    Price: Rs.
                    <span th:text="${#numbers.formatDecimal(item.product.price, 1, 'COMMA', 2, 'POINT')}">0.00</span>
                </p>

                <p>
                    Line total: Rs.
                    <strong th:text="${#numbers.formatDecimal(item.lineTotal, 1, 'COMMA', 2, 'POINT')}">0.00</strong>
                </p>
            </div>

            <div class="cart-actions">
                <form th:action="@{/cart/update}" method="post">
                    <input type="hidden" name="productId" th:value="${item.product.id}">
                    <input type="number" name="quantity"
                           min="0" max="99" th:value="${item.quantity}"
                           aria-label="Quantity">
                    <button type="submit">Update</button>
                </form>

                <form th:action="@{/cart/remove}" method="post">
                    <input type="hidden" name="productId" th:value="${item.product.id}">
                    <button type="submit">Remove</button>
                </form>
            </div>
        </article>

        <div class="cart-summary">
            <h2>
                <span>Subtotal</span>
                <span>
                    Rs.
                    <span th:text="${#numbers.formatDecimal(subtotal, 1, 'COMMA', 2, 'POINT')}">0.00</span>
                </span>
            </h2>

            <p>Delivery charges, if applicable, are not included.</p>

            <a th:href="@{/checkout}" class="cart-button checkout-button">
                Proceed to Checkout
            </a>
            <a th:href="@{/}" class="cart-button continue-button">
                Continue Shopping
            </a>
        </div>
    </div>
</main>

</body>
</html>
